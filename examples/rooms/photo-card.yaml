# Hive-style heating - photo cards for the Rooms page.
# Added for you by the setup page (tick "Rooms page with room photos"); this file is the reference version.
#
# Each card shows the room's own picture from Home Assistant (Settings > Areas > the room > edit > picture),
# found through the radiator's Area. A room without a picture shows a plain dark card.
# The tint follows the radiator: blue-grey when off, amber while heating, orange while boosting.
# Variables: name, icon, room_temp / room_humidity (a room sensor, optional), photo_a (override the
# Area picture with your own image address), photo_b (a second photo it slowly fades to).
button_card_templates:
  hive_photo_device:
    variables:
      name: ''
      icon: mdi:radiator
      photo_a: '[[[ const e = hass.entities && entity ? hass.entities[entity.entity_id] : null; let a = e && e.area_id; if (!a && e && e.device_id && hass.devices && hass.devices[e.device_id]) a = hass.devices[e.device_id].area_id; const ar = a && hass.areas ? hass.areas[a] : null; return (ar && ar.picture) || ''''; ]]]'
      photo_b: ''
      room_temp: ''
      room_humidity: ''
    show_icon: false
    show_name: false
    show_state: false
    hold_action:
      action: more-info
    triggers_update: []
    styles:
      card:
      - background: '#2A2B33'
      - border-radius: 22px
      - box-shadow: 0 6px 18px rgba(30,30,60,0.18)
      - border: none
      - padding: 16px 16px 16px 18px
      - color: '#FFFFFF'
      - font-family: Inter, sans-serif
      - overflow: hidden
      - position: relative
      - isolation: isolate
      - min-height: 156px
      grid:
      - grid-template-areas: '"head head" "temp boost"'
      - grid-template-columns: 1fr auto
      - row-gap: 16px
      custom_fields:
        bg:
        - position: absolute
        - top: '0'
        - left: '0'
        - right: '0'
        - bottom: '0'
        - z-index: '0'
        - pointer-events: none
        head:
        - position: relative
        - z-index: '1'
        - justify-self: stretch
        temp:
        - position: relative
        - z-index: '1'
        - justify-self: start
        - align-self: end
        boost:
        - position: relative
        - z-index: '1'
        - justify-self: end
        - align-self: center
    custom_fields:
      bg: "[[[ const eid=entity.entity_id; const st=entity.state; const obj=eid.split('.')[1];\nconst tm=states['timer.boost_'+obj]; const hb=states['binary_sensor.'+obj+'_boost'];\n        const boost = !!(tm&&tm.state==='active') || entity.attributes.preset_mode==='boost' || !!(hb&&hb.state==='on');\nconst heating = ((m)=>{const s=states[m];const b=(hass.entities&&(hass.entities[m]||{}).platform==='hive')?states['binary_sensor.'+m.split('.')[1]+'_state']:null;return b?b.state==='on':(s&&s.attributes.hvac_action!==undefined?s.attributes.hvac_action==='heating':true);})('climate.hive_thermostat') && ((s=>s?s.state==='on':entity.attributes.hvac_action==='heating')((hass.entities&&(hass.entities[entity.entity_id]||{}).platform==='hive')?states['binary_sensor.'+obj+'_state']:null));\nconst t=parseFloat(entity.attributes.temperature);\nconst off = st==='off' || isNaN(t) || t<=7;\nlet tint, filt;\nif(boost){ tint='linear-gradient(105deg,rgba(214,78,28,.88) 0%,rgba(232,100,46,.58) 55%,rgba(240,150,70,.25) 100%)'; filt='saturate(1.15)'; }\nelse if(heating){ tint='linear-gradient(105deg,rgba(110,38,12,.86) 0%,rgba(200,85,35,.48) 60%,rgba(232,120,60,.18) 100%)'; filt='saturate(1.1)'; }\nelse if(off){ tint='linear-gradient(105deg,rgba(16,20,38,.88) 0%,rgba(28,34,66,.62) 60%,rgba(40,48,90,.32) 100%)'; filt='grayscale(.75) brightness(.85)'; }\nelse { tint='linear-gradient(105deg,rgba(22,22,28,.84) 0%,rgba(22,22,28,.48) 60%,rgba(22,22,28,.18) 100%)'; filt='none'; }\nconst d = obj.length % 7;\nconst layer = (u, anim) => u ? `<div style=\"position:absolute;inset:-6%;background:url('${u}') center/cover no-repeat;filter:${filt};animation:${anim};animation-delay:-${d}s;transition:filter .6s\"></div>` : '';\nreturn `<style>@keyframes hpZoom{0%{transform:scale(1)}50%{transform:scale(1.07) translate(-1.5%,-1%)}100%{transform:scale(1)}}@keyframes hpFade{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@media (prefers-reduced-motion:reduce){div{animation:none!important}}</style><div style=\"position:absolute;inset:0;overflow:hidden;border-radius:22px\">${variables.photo_b ? layer(variables.photo_b,'hpZoom 26s ease-in-out infinite') + layer(variables.photo_a,'hpZoom 26s ease-in-out infinite, hpFade 18s ease-in-out infinite') : layer(variables.photo_a,'hpZoom 26s ease-in-out infinite')}<div style=\"position:absolute;inset:0;background:${tint};transition:background .6s\"></div></div>`; ]]]"
      head: "[[[ const eid=entity.entity_id; const obj=eid.split('.')[1];\nconst tm=states['timer.boost_'+obj]; const hb=states['binary_sensor.'+obj+'_boost'];\n        const boost = !!(tm&&tm.state==='active') || entity.attributes.preset_mode==='boost' || !!(hb&&hb.state==='on');\nconst t=parseFloat(entity.attributes.temperature);\nconst sh='text-shadow:0 1px 4px rgba(0,0,0,.45)';\nlet right;\nif(entity.state==='off' || isNaN(t) || t<=7){ right='Off'; }\nelse {\n  const cur=parseFloat(entity.attributes.current_temperature);\n  const ic = (boost || ((s=>s?s.state==='on':entity.attributes.hvac_action==='heating')((hass.entities&&(hass.entities[entity.entity_id]||{}).platform==='hive')?states['binary_sensor.'+obj+'_state']:null))) ? `<ha-icon icon='mdi:fire' style='--mdc-icon-size:20px;color:${((m)=>{const s=states[m];const b=(hass.entities&&(hass.entities[m]||{}).platform==='hive')?states['binary_sensor.'+m.split('.')[1]+'_state']:null;return b?b.state==='on':(s&&s.attributes.hvac_action!==undefined?s.attributes.hvac_action==='heating':true);})('climate.hive_thermostat')?'#FFB27A':'#D0D1DA'};margin-left:8px'></ha-icon>` : (cur>=t ? `<ha-icon icon='mdi:check-circle-outline' style='--mdc-icon-size:20px;color:#FFFFFF;margin-left:8px'></ha-icon>` : '');\n  right = `Target&nbsp;<span style='font-weight:600'>${t.toFixed(1)}°</span>${ic}`;\n}\nreturn `<div style='display:flex;align-items:center;gap:12px;color:#FFFFFF;${sh}'><div style='width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;flex:none'><ha-icon icon='${variables.icon}' style='--mdc-icon-size:17px;color:#FFFFFF'></ha-icon></div><div style='flex:1;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left'>${variables.name||entity.attributes.friendly_name}</div><div style='font-size:17px;display:flex;align-items:center;white-space:nowrap'>${right}</div></div>`; ]]]"
      temp: "[[[ const obj=entity.entity_id.split('.')[1];\nconst tm=states['timer.boost_'+obj]; const hb=states['binary_sensor.'+obj+'_boost'];\n        const boost = !!(tm&&tm.state==='active') || entity.attributes.preset_mode==='boost' || !!(hb&&hb.state==='on');\nconst rs = variables.room_temp ? states[variables.room_temp] : null;\nconst rt = rs ? parseFloat(rs.state) : NaN;\nconst c = !isNaN(rt) ? rt : parseFloat(entity.attributes.current_temperature);\nconst hs = variables.room_humidity ? states[variables.room_humidity] : null;\nconst h = hs ? parseFloat(hs.state) : NaN;\nlet sub = 'Actual';\nif(!isNaN(h)) sub += ` · ${Math.round(h)}% humidity`;\nif(boost) sub += ' · Boosting'; else if(((s=>s?s.state==='on':entity.attributes.hvac_action==='heating')((hass.entities&&(hass.entities[entity.entity_id]||{}).platform==='hive')?states['binary_sensor.'+obj+'_state']:null))) sub += (((m)=>{const s=states[m];const b=(hass.entities&&(hass.entities[m]||{}).platform==='hive')?states['binary_sensor.'+m.split('.')[1]+'_state']:null;return b?b.state==='on':(s&&s.attributes.hvac_action!==undefined?s.attributes.hvac_action==='heating':true);})('climate.hive_thermostat')?' · Heating':' · Waiting for the boiler');\nreturn `<div style='text-align:left;color:#FFFFFF;text-shadow:0 2px 8px rgba(0,0,0,.45)'><div style='font-size:46px;font-weight:500;letter-spacing:-1px;line-height:1'>${isNaN(c)?'--':c.toFixed(1)}°</div><div style='font-size:13px;opacity:.9;margin-top:6px'>${sub}</div></div>`; ]]]"
    tap_action:
      action: more-info

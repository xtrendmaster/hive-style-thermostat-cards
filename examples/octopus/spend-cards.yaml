- type: statistics-graph
  title: Daily spend · last 30 days
  entities:
  - entity: sensor.octopus_energy_gas_YOUR_METER_current_accumulative_cost
    name: Gas
    color: '#E8642E'
  - entity: sensor.octopus_energy_electricity_YOUR_METER_current_accumulative_cost
    name: Electricity
    color: '#4350E6'
  stat_types:
  - change
  period: day
  days_to_show: 30
  chart_type: bar
  card_mod:
    style: 'ha-card { --primary-text-color: var(--hs-text,#2B2B2E); --secondary-text-color: var(--hs-sub,#66666B); --card-background-color: var(--hs-card,#FFFFFF); --ha-card-background: var(--hs-card,#FFFFFF); background: var(--hs-card,#FFFFFF) !important; color: var(--hs-text,#2B2B2E) !important; border: none !important; border-radius: 20px !important; box-shadow: 0 1px 8px rgba(40,40,80,0.06) !important; font-family: Inter, sans-serif; }'
  grid_options:

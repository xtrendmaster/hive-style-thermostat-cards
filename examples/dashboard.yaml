      triggers_update:
      - sensor.hive_thermostat_battery_level
      - sensor.bedroom_radiator_battery_level
      - sensor.study_radiator_battery
      custom_fields:
        list: '[[[ const findBatt = (eid, override) => { if (override) return override; const e = hass.entities && hass.entities[eid]; if (!e || !e.device_id) return null; for (const x of Object.values(hass.entities)) { if (x.device_id === e.device_id) { const s = states[x.entity_id]; if (s && s.attributes.device_class === ''battery'' && !isNaN(parseFloat(s.state))) return x.entity_id; } } return null; }; const items = variables.items || []; let h = `<div style=''display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:6px''><div style=''width:42px;height:42px;border-radius:50%;background:var(--hs-line,#ECECF0);display:flex;align-items:center;justify-content:center;flex:none''><ha-icon icon=''mdi:battery-heart-variant'' style=''--mdc-icon-size:22px;color:var(--hs-text,#2B2B2E)''></ha-icon></div><div><div style=''font-size:17px;font-weight:500;color:var(--hs-text,#2B2B2E)''>Batteries</div><div style=''font-size:14px;color:var(--hs-sub,#66666B);margin-top:2px''>Valves and thermostat</div></div></div>`;
          items.forEach(([n, eid, ov]) => { if (!states[eid]) return; const bid = findBatt(eid, ov); const b = bid && states[bid] ? parseFloat(states[bid].state) : NaN; const r = isNaN(b) ? null : Math.round(b); const col = r === null ? ''var(--hs-sub,#9A9AA2)'' : (r < 15 ? ''#D9342B'' : (r < 30 ? ''#E8A33A'' : ''#2E9E5B'')); const lvl = r === null ? 0 : Math.min(100, Math.max(10, Math.round(r / 10) * 10)); const ic = r === null ? ''mdi:battery-unknown'' : (r < 15 ? ''mdi:battery-alert-variant-outline'' : (lvl === 100 ? ''mdi:battery'' : ''mdi:battery-'' + lvl)); h += `<div style=''display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hs-line,#EFEFF3)''><ha-icon icon=''${ic}'' style=''--mdc-icon-size:22px;color:${col};flex:none''></ha-icon><div style=''flex:1;min-width:0;text-align:left;font-size:15px;color:var(--hs-text,#2B2B2E)''>${n}</div><div style=''width:90px;height:6px;border-radius:3px;background:var(--hs-line,#ECECF0);overflow:hidden;flex:none''><div
          style=''height:100%;width:${r === null ? 0 : r}%;background:${col}''></div></div><div style=''width:44px;text-align:right;font-size:15px;font-weight:500;color:${col}''>${r === null ? ''--'' : r + ''%''}</div></div>`; }); return h; ]]]'

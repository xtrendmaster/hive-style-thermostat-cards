          const cur=parseFloat(entity.attributes.current_temperature); const t=parseFloat(entity.attributes.temperature);

          let mode, col=''var(--hs-sub,#55555B)'', warn='''';

          if(st===''off''){ mode=''Off''; }

          else if(st===''heat'' && ha && states[''input_boolean.heating_away_eco_active''] && states[''input_boolean.heating_away_eco_active''].state===''on''){ mode=''Away eco – nobody home''; col=''#2E9E5B''; }

          else if(st===''heat'' && ha){ mode=''Schedule (Home Assistant)''; col=''#4350E6''; }

          else if(st===''auto''){ mode="Hive''s own schedule"; col=''#D9342B''; warn=`<div style=''font-size:12px;color:#D9342B;margin-top:4px''>Tap Schedule to hand control back to Home Assistant</div>`; }

          else { mode=''Manual''; }

          let tgt='''';

          if(st!==''off'' && !isNaN(t)) tgt = t<=7 ? '' · off until next slot'' : ` · target ${t.toFixed(1)}°`;

          const heating = entity.attributes.hvac_action===''heating'' ? `<ha-icon icon=''mdi:fire'' style=''--mdc-icon-size:16px;color:#E8642E;margin-left:4px''></ha-icon>` : '''';


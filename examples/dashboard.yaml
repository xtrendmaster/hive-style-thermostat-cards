# Hive-style thermostat cards - example dashboard (v1.6)
# Easiest: use the setup page instead (add the card "Hive-style heating setup" to an empty dashboard).
# Manual: Settings > Dashboards > Add dashboard > "New dashboard from scratch", URL: hive-heating,
# then ... > Edit > Raw configuration editor > paste this file and replace the example entity IDs
# (climate.hive_thermostat, water_heater.hive_hot_water, climate.bedroom_radiator, climate.study_radiator,
# binary_sensor.hive_*, sensor.hive_thermostat_battery_level). Batteries card: edit variables.items.
button_card_templates:
  hive_advance:
    icon: mdi:chevron-double-right
    name: Advance to next
    styles:
      card:
      - opacity: '[[[ return entity.state===''on'' ? ''1'' : ''0.45'' ]]]'
    tap_action:
      action: perform-action
      perform_action: script.hive_advance_to_next
    template: hive_pill_link
  hive_arrow_down:
    icon: mdi:menu-down
    tap_action:
      action: fire-dom-event
      hive_nudge:
        entity_id: '[[[ return entity.entity_id ]]]'
        delta: -0.5
      haptic: light
    template: hive_arrow_up
  hive_arrow_up:
    icon: mdi:menu-up
    show_icon: true
    styles:
      card:
      - width: 90px
      - height: 56px
      - visibility: '[[[ return entity.state===''off'' ? ''hidden'' : ''visible'' ]]]'
      icon:
      - width: 64px
      - color: rgba(255,255,255,0.5)
    tap_action:
      action: fire-dom-event
      hive_nudge:
        entity_id: '[[[ return entity.entity_id ]]]'
        delta: 0.5
      haptic: light
    template: hive_clear
  hive_away:
    custom_fields:
      k: '[[[ return `<div style=''width:28px;height:28px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 4px rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center''><ha-icon icon=''mdi:walk'' style=''--mdc-icon-size:17px;color:#333''></ha-icon></div>`; ]]]'
    styles:
      card:
      - width: 56px
      - height: 32px
      - border-radius: 16px
      - overflow: visible
      - background: '[[[ return entity.state===''on'' ? ''#4350E6'' : ''var(--hs-line,#E7E7EC)'' ]]]'
      - box-shadow: inset 0 0 0 1px rgba(128,128,140,0.35)
      custom_fields:
        k:
        - position: absolute
        - top: 2px
        - left: '[[[ return entity.state===''on'' ? ''26px'' : ''2px'' ]]]'
        - transition: left 0.2s ease
      grid:
      - grid-template-areas: '"k"'
      - grid-template-columns: 1fr
    tap_action:
      action: toggle
    template: hive_clear
  hive_back:
    icon: mdi:chevron-left
    show_icon: true
    styles:
      card:
      - width: 46px
      - height: 46px
      - border-radius: 50%
      - background: rgba(255,255,255,0.22)
      - box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.45)
      icon:
      - width: 24px
      - color: '#FFFFFF'
    tap_action:
      action: navigate
      navigation_path: /hive-heating/home
    template: hive_clear
  hive_back_dark:
    icon: mdi:chevron-left
    show_icon: true
    styles:
      card:
      - width: 46px
      - height: 46px
      - border-radius: 50%
      - background: var(--hs-card,#FFFFFF)
      - box-shadow: 0 2px 8px rgba(0,0,0,0.10), inset 0 0 0 1px var(--hs-line,#ECECF0)
      icon:
      - width: 24px
      - color: var(--hs-text,#2F2F33)
    template: hive_clear
  hive_boost_big:
    icon: mdi:bullseye
    name: '[[[ const eid=entity.entity_id; const bs=eid===''climate.hive_thermostat''?''binary_sensor.hive_thermostat_boost'':(eid===''water_heater.hive_hot_water''?''binary_sensor.hive_hot_water_boost'':''''); const tm=states[''timer.boost_''+eid.split(''.'')[1]]; const boost=bs?!!(states[bs]&&states[bs].state===''on''):(tm?tm.state===''active'':entity.attributes.preset_mode===''boost''); return boost?''Boosting · tap to stop'':''Boost''; ]]]'
    show_icon: true
    show_name: true
    styles:
      card:
      - padding: 6px 10px
      - border-radius: 18px
      - background: none !important
      - background-color: transparent !important
      - backdrop-filter: none !important
      - -webkit-backdrop-filter: none !important
      - box-shadow: none !important
      icon:
      - width: 34px
      - color: '#FFFFFF'
      name:
      - font-size: 17px
      - color: '#FFFFFF'
      - padding-top: 8px
    tap_action:
      action: fire-dom-event
      hive_boost:
        entity_id: '[[[ return entity.entity_id ]]]'
        name: '[[[ return (variables && variables.name) || '''' ]]]'
      haptic: light
    template: hive_clear
    triggers_update:
    - binary_sensor.hive_thermostat_boost
    - binary_sensor.hive_hot_water_boost
    - timer.boost_study_radiator
    extra_styles: 'ha-card, ha-card::before, ha-card::after { background: none !important; background-color: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; } #ripple, ha-ripple, mwc-ripple { display: none !important; } ha-card::before, ha-card::after { content: none !important; display: none !important; background: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; border: none !important; box-shadow: none !important; } :host { background: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; border: none !important; }'
    hold_action:
      action: perform-action
      perform_action: script.hive_boost
      data:
        entity_id: entity
  hive_boost_pill:
    icon: mdi:bullseye
    layout: icon_name
    name: '[[[ const eid=entity.entity_id; const bs=eid===''climate.hive_thermostat''?''binary_sensor.hive_thermostat_boost'':(eid===''water_heater.hive_hot_water''?''binary_sensor.hive_hot_water_boost'':''''); const tm=states[''timer.boost_''+eid.split(''.'')[1]]; const boost=bs?!!(states[bs]&&states[bs].state===''on''):(tm?tm.state===''active'':entity.attributes.preset_mode===''boost''); return boost?''Boosting'':''Boost''; ]]]'
    show_icon: true
    show_name: true
    styles:
      card:
      - width: 122px
      - height: 44px
      - border-radius: 14px
      - padding: 0 12px
      - background: '[[[ const eid=entity.entity_id; const bs=eid===''climate.hive_thermostat''?''binary_sensor.hive_thermostat_boost'':(eid===''water_heater.hive_hot_water''?''binary_sensor.hive_hot_water_boost'':''''); const tm=states[''timer.boost_''+eid.split(''.'')[1]]; const boost=bs?!!(states[bs]&&states[bs].state===''on''):(tm?tm.state===''active'':entity.attributes.preset_mode===''boost''); return boost?''#4350E6'':''var(--hs-pill,#EEF0FD)''; ]]]'
      grid:
      - grid-template-columns: auto auto
      - justify-content: center
      - column-gap: 8px
      icon:
      - width: 22px
      - color: '[[[ const eid=entity.entity_id; const bs=eid===''climate.hive_thermostat''?''binary_sensor.hive_thermostat_boost'':(eid===''water_heater.hive_hot_water''?''binary_sensor.hive_hot_water_boost'':''''); const tm=states[''timer.boost_''+eid.split(''.'')[1]]; const boost=bs?!!(states[bs]&&states[bs].state===''on''):(tm?tm.state===''active'':entity.attributes.preset_mode===''boost''); return boost?''#FFFFFF'':''#4350E6''; ]]]'
      name:
      - font-size: 17px
      - color: '[[[ const eid=entity.entity_id; const bs=eid===''climate.hive_thermostat''?''binary_sensor.hive_thermostat_boost'':(eid===''water_heater.hive_hot_water''?''binary_sensor.hive_hot_water_boost'':''''); const tm=states[''timer.boost_''+eid.split(''.'')[1]]; const boost=bs?!!(states[bs]&&states[bs].state===''on''):(tm?tm.state===''active'':entity.attributes.preset_mode===''boost''); return boost?''#FFFFFF'':''#4350E6''; ]]]'
    tap_action:
      action: fire-dom-event
      hive_boost:
        entity_id: '[[[ return entity.entity_id ]]]'
        name: '[[[ return (variables && variables.name) || '''' ]]]'
      haptic: light
    template: hive_clear
    triggers_update:
    - binary_sensor.hive_thermostat_boost
    - binary_sensor.hive_hot_water_boost
    - timer.boost_study_radiator
    hold_action:
      action: perform-action
      perform_action: script.hive_boost
      data:
        entity_id: entity
  hive_clear:
    hold_action:
      action: none
    show_icon: false
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - background: none
      - box-shadow: none
      - border: none
      - border-radius: '0'
      - padding: '0'
      - font-family: Inter, sans-serif
      - --ha-ripple-color: transparent
      - --ha-ripple-hover-opacity: '0'
      - --ha-ripple-pressed-opacity: '0'
      - -webkit-tap-highlight-color: transparent
      - backdrop-filter: none
      - -webkit-backdrop-filter: none
      - --ha-card-background: transparent
      - --card-background-color: transparent
      - --ha-card-backdrop-filter: none
      - --ha-card-border-width: '0'
    tap_action:
      action: none
  hive_day:
    show_name: true
    styles:
      card:
      - height: 40px
      - width: 40px
      - border-radius: 50%
      - margin: 0 auto
      - background: '[[[ return entity.state===variables.day ? ''#4350E6'' : ''transparent'' ]]]'
      name:
      - font-size: 18px
      - color: '[[[ return entity.state===variables.day ? ''#FFFFFF'' : ''var(--hs-text,#2F2F33)'' ]]]'
    template: hive_clear
  hive_detail:
    custom_fields:
      home: '[[[ if (entity.entity_id.startsWith(''water_heater.'')) return ''''; const findBatt = (eid, override) => { if (override) return override; const e = hass.entities && hass.entities[eid]; if (!e || !e.device_id) return null; for (const x of Object.values(hass.entities)) { if (x.device_id === e.device_id) { const s = states[x.entity_id]; if (s && s.attributes.device_class === ''battery'' && !isNaN(parseFloat(s.state))) return x.entity_id; } } return null; }; const c = parseFloat(entity.attributes.current_temperature); const bid = findBatt(entity.entity_id, variables.battery); const b = bid && states[bid] ? parseFloat(states[bid].state) : NaN; let bh = ''''; if (!isNaN(b)) { const r = Math.round(b); const lvl = Math.min(100, Math.max(10, Math.round(r / 10) * 10)); const ic = r < 15 ? ''mdi:battery-alert-variant-outline'' : (lvl === 100 ? ''mdi:battery'' : ''mdi:battery-'' + lvl); const col = r < 15 ? ''#FFB3AD'' : ''#FFFFFF''; bh = `<span style=''opacity:.45;margin:0 4px''>·</span><ha-icon
        icon=''${ic}'' style=''--mdc-icon-size:20px;color:${col}''></ha-icon><span style=''font-size:16px;color:${col}''>${r}%</span>`; } return `<div style=''display:inline-flex;align-items:center;gap:8px;white-space:nowrap;color:#FFFFFF;font-size:19px''><ha-icon icon=''mdi:home-outline'' style=''--mdc-icon-size:24px''></ha-icon>${isNaN(c) ? ''--'' : c.toFixed(1)}°${bh}</div>`; ]]]'
      num: '[[[ const eid=entity.entity_id; const st=entity.state; const big=(x)=>`<div style=''font-family:DM Serif Display,serif;color:#FFFFFF;font-size:96px;line-height:1;letter-spacing:-2px''>${x}</div>`; if(eid.startsWith(''water_heater.'')){ const hw=states[''binary_sensor.hive_hot_water_state'']; return big(st===''off''?''Off'':((hw&&hw.state===''on'')?''On'':''Off'')); } const t=parseFloat(entity.attributes.temperature); if(st===''off''||isNaN(t)) return big(''Off''); const p=t.toFixed(1).split(''.''); return `<div style=''display:flex;align-items:flex-start;font-family:DM Serif Display,serif;color:#FFFFFF;line-height:0.8''><span style=''font-size:112px;letter-spacing:-3px''>${p[0]}</span><span style=''display:flex;flex-direction:column;justify-content:space-between;height:84px;margin-left:4px''><span style=''display:block;width:19px;height:19px;border:4px solid #FFFFFF;border-radius:50%;box-sizing:border-box;margin-top:-4px''></span><span style=''font-size:46px''>.${p[1]}</span></span></div>`;
        ]]]'
      ruler: '[[[ const st=entity.state; if(entity.entity_id.startsWith(''water_heater.'')||st===''off'') return ''''; const t=parseFloat(entity.attributes.temperature); const cur=parseFloat(entity.attributes.current_temperature); if(isNaN(t)) return ''''; const house=isNaN(cur)?null:Math.round(cur*2)/2; const step=47, mid=235; const dash=`<div style=''width:13px;height:3px;border-radius:2px;background:rgba(255,255,255,0.55)''></div>`; let h=''''; for(let i=-5;i<=5;i++){ const v=Math.round((t+i*0.5)*2)/2; const y=mid-i*step; let el; if(i===0) el=`<div style=''width:58px;height:5px;border-radius:3px;background:var(--hs-card,#FFFFFF)''></div>`; else if(house!==null&&v===house) el=`<div style=''display:flex;align-items:center;gap:6px''>${dash}<ha-icon icon=''mdi:home'' style=''--mdc-icon-size:22px;color:rgba(255,255,255,0.7)''></ha-icon></div>`; else if(Math.abs((v%1)-0.5)<0.01) el=`<div style=''font-size:20px;font-weight:600;letter-spacing:-0.3px;color:rgba(255,255,255,0.72)''>${v.toFixed(1)}°</div>`;
        else el=dash; h+=`<div style=''position:absolute;left:0;top:${y}px;transform:translateY(-50%);display:flex;align-items:center''>${el}</div>`; } return `<div style=''position:relative;height:${mid*2}px;width:100%;-webkit-mask-image:linear-gradient(transparent 0%,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(transparent 0%,#000 14%,#000 86%,transparent 100%)''>${h}</div>`; ]]]'
      title: '[[[ return `<div style=''font-size:19px;color:#FFFFFF;white-space:nowrap''>${variables.name||entity.attributes.friendly_name}</div>`; ]]]'
    hold_action:
      action: none
    show_icon: false
    show_name: false
    show_state: false
    styles:
      card:
      - min-height: 100vh
      - border-radius: '0'
      - border: none
      - box-shadow: none
      - padding: calc(env(safe-area-inset-top) + 10px) 16px 40px
      - font-family: Inter, sans-serif
      - background: '[[[ const st=entity.state; const ph=variables.bg_photo; const a=ph?0.55:1; const ga=ph?0.6:1; const grey=`linear-gradient(180deg,rgba(142,151,172,${ga}) 0%,rgba(186,193,207,${ga}) 100%)`; let g; if(entity.entity_id.startsWith(''water_heater.'')) g = st===''off''?grey:''linear-gradient(180deg,#3E7FE0 0%,#5E9EEC 55%,#7DB7F2 100%)''; else if(st===''off'') g = grey; else { const t=parseFloat(entity.attributes.temperature); const H=[[5,222],[9,250],[13,300],[16,350],[18.5,376],[22,368],[30,358]]; const c=Math.max(5,Math.min(30,isNaN(t)?18.5:t)); let h=358; for(let i=0;i<H.length-1;i++){ if(c<=H[i+1][0]){ h=H[i][1]+(H[i+1][1]-H[i][1])*(c-H[i][0])/(H[i+1][0]-H[i][0]); break; } } g=`linear-gradient(180deg,hsla(${(h%360).toFixed(0)},76%,56%,${a}) 0%,hsla(${((h+14)%360).toFixed(0)},80%,64%,${a}) 100%)`; } return ph ? `${g}, url("${ph}")` : g; ]]]'
      - transition: background 0.4s ease
      - background-repeat: no-repeat
      - background-size: '[[[ return variables.bg_photo ? (variables.bg_pan ? ''100% 100%, auto 100%'' : ''100% 100%, cover'') : ''auto''; ]]]'
      - animation: '[[[ return (variables.bg_photo && variables.bg_pan) ? `hive-pan ${variables.bg_pan}s ease-in-out infinite alternate` : ''none''; ]]]'
      - background-position: '[[[ return variables.bg_photo ? ''0 0, center'' : ''center''; ]]]'
      custom_fields:
        actions:
        - margin: 22px 18px 0
        back:
        - justify-self: start
        boost:
        - align-self: center
        - justify-self: center
        down:
        - align-self: start
        - justify-self: center
        home:
        - margin-top: 22px
        - justify-self: center
        modes:
        - margin: 20px 8px 0
        - background: var(--hs-modebar,#F1F2FB)
        - border-radius: 24px
        - padding: 4px
        num:
        - align-self: center
        - justify-self: center
        ruler:
        - align-self: start
        - justify-self: stretch
        - height: 470px
        title:
        - justify-self: center
        tools:
        - justify-self: end
        - width: 84px
        - background: rgba(255,255,255,0.22)
        - border-radius: 22px
        - box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.45)
        - padding: 3px 4px
        up:
        - align-self: end
        - justify-self: center
      grid:
      - grid-template-areas: '"back title tools" "ruler up ." "ruler num ." "ruler down ." "ruler boost ." "home home home" "modes modes modes" "actions actions actions"'
      - grid-template-columns: 1fr auto 1fr
      - grid-template-rows: 64px 185px 100px 60px 125px auto auto auto
      - align-content: start
    tap_action:
      action: none
    triggers_update:
    - input_boolean.hive_ha_schedule
    - binary_sensor.hive_hot_water_state
    - binary_sensor.hive_thermostat_boost
    - binary_sensor.hive_hot_water_boost
    variables:
      name: ''
      bg_photo: ''
    extra_styles: '@keyframes hive-pan { 0% { background-position: 0 0, 0% 50%; } 100% { background-position: 0 0, 100% 50%; } }'
  hive_device:
    custom_fields:
      head: '[[[ const eid=entity.entity_id; const t=parseFloat(entity.attributes.temperature); let right; if(eid.startsWith(''water_heater.'')){ const hw=states[''binary_sensor.hive_hot_water_state'']; right=(hw&&hw.state===''on'')?''On'':''Off''; } else if(entity.state===''off''||isNaN(t)||t<=7){ right=''Off''; } else { const cur=parseFloat(entity.attributes.current_temperature); const ic=entity.attributes.hvac_action===''heating''?`<ha-icon icon=''mdi:fire'' style=''--mdc-icon-size:20px;color:#E8642E;margin-left:8px''></ha-icon>`:(cur>=t?`<ha-icon icon=''mdi:check-circle-outline'' style=''--mdc-icon-size:20px;color:var(--hs-text,#2F2F33);margin-left:8px''></ha-icon>`:''''); right=`Target&nbsp;<span style=''font-weight:600''>${t.toFixed(1)}°</span>${ic}`; } return `<div style=''display:flex;align-items:center;gap:12px''><div style=''width:30px;height:30px;border-radius:9px;background:var(--hs-line,#F2F2F5);display:flex;align-items:center;justify-content:center;flex:none''><ha-icon icon=''${variables.icon}''
        style=''--mdc-icon-size:17px;color:var(--hs-text,#3A3A3E)''></ha-icon></div><div style=''flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left''>${variables.name||entity.attributes.friendly_name}</div><div style=''font-size:17px;display:flex;align-items:center;white-space:nowrap''>${right}</div></div>`; ]]]'
      temp: '[[[ if(entity.entity_id.startsWith(''water_heater.'')) return `<div style=''height:44px''></div>`; const c=parseFloat(entity.attributes.current_temperature); return `<div style=''text-align:left''><div style=''font-size:46px;font-weight:500;letter-spacing:-1px;line-height:1;color:var(--hs-text,#2F2F33)''>${isNaN(c)?''--'':c.toFixed(1)}°</div><div style=''font-size:13px;color:var(--hs-sub,#55555B);margin-top:6px''>Actual</div></div>`; ]]]'
      batt: '[[[ const findBatt = (eid, override) => { if (override) return override; const e = hass.entities && hass.entities[eid]; if (!e || !e.device_id) return null; for (const x of Object.values(hass.entities)) { if (x.device_id === e.device_id) { const s = states[x.entity_id]; if (s && s.attributes.device_class === ''battery'' && !isNaN(parseFloat(s.state))) return x.entity_id; } } return null; }; const bid = findBatt(entity.entity_id, variables.battery); const b = bid && states[bid] ? parseFloat(states[bid].state) : NaN; if (isNaN(b) || b >= 15) return ''''; return `<div style=''width:22px;height:22px;border-radius:50%;background:#D9342B;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--hs-card,#FFFFFF)''><ha-icon icon=''mdi:battery-alert-variant-outline'' style=''--mdc-icon-size:14px;color:#FFFFFF''></ha-icon></div>`; ]]]'
    hold_action:
      action: more-info
    show_icon: false
    show_name: false
    show_state: false
    styles:
      card:
      - background: var(--hs-card,#FFFFFF)
      - border-radius: 20px
      - box-shadow: 0 1px 8px rgba(40,40,80,0.06)
      - border: none
      - padding: 16px 16px 16px 18px
      - color: var(--hs-text,#2F2F33)
      - font-family: Inter, sans-serif
      custom_fields:
        boost:
        - justify-self: end
        - align-self: center
        head:
        - justify-self: stretch
        temp:
        - justify-self: start
        - align-self: end
        batt:
        - position: absolute
        - top: 10px
        - left: 44px
        - z-index: '3'
        - pointer-events: none
      grid:
      - grid-template-areas: '"head head" "temp boost"'
      - grid-template-columns: 1fr auto
      - row-gap: 14px
    triggers_update:
    - input_boolean.hive_ha_schedule
    - binary_sensor.hive_hot_water_state
    - binary_sensor.hive_thermostat_boost
    - binary_sensor.hive_hot_water_boost
    variables:
      icon: mdi:thermometer
      name: ''
  hive_icon_white:
    show_icon: true
    styles:
      card:
      - height: 38px
      - border-radius: 22px
      - background: none !important
      - background-color: transparent !important
      - backdrop-filter: none !important
      - -webkit-backdrop-filter: none !important
      - box-shadow: none !important
      icon:
      - width: 22px
      - color: '#FFFFFF'
    template: hive_clear
    extra_styles: 'ha-card, ha-card::before, ha-card::after { background: none !important; background-color: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; } #ripple, ha-ripple, mwc-ripple { display: none !important; } ha-card::before, ha-card::after { content: none !important; display: none !important; background: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; border: none !important; box-shadow: none !important; } :host { background: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; border: none !important; }'
  hive_menu:
    icon: mdi:dots-horizontal
    show_icon: true
    styles:
      card:
      - width: 40px
      - height: 40px

  hive_sched_list:
    custom_fields:
      list: '[[[ const names=[''Mon'',''Tue'',''Wed'',''Thu'',''Fri'',''Sat'',''Sun'']; const keys=[''mon'',''tue'',''wed'',''thu'',''fri'',''sat'',''sun'']; let di=names.indexOf(entity.state); if(di<0) di=0; const scheds=Object.keys(states).filter(k=>k.startsWith(''switch.'')).map(k=>states[k]).filter(s=>Array.isArray(s.attributes.tags)&&s.attributes.tags.includes(''hive_heating'')); const covers=(s,k)=>{const w=s.attributes.weekdays||[]; return w.includes(k)||w.includes(''daily'')||(w.includes(''workday'')&&keys.slice(0,5).includes(k))||(w.includes(''weekend'')&&(k===''sat''||k===''sun''));}; const val=(a)=>{ if(!a) return ''off''; const d=a.data||a.service_data||{}; if(d.hvac_mode===''off'') return ''off''; const t=parseFloat(d.temperature); return (isNaN(t)||t<=7)?''off'':t; }; const slots=(i)=>{ const k=keys[(i+7)%7]; const s=scheds.find(x=>x.state!==''off''&&covers(x,k))||scheds.find(x=>covers(x,k)); if(!s) return []; const ts=s.attributes.timeslots||[]; const ac=s.attributes.actions||[];
        return ts.map((t,j)=>{ const p=String(t).split('' - ''); return {start:p[0].slice(0,5), end:(p[1]||'''').slice(0,5), v:val(ac.length>1?ac[j]:ac[0])}; }).sort((a,b)=>a.start.localeCompare(b.start)); }; let cur=slots(di); const prev=slots(di-1); const next=slots(di+1); if(cur.length>1&&cur[0].start===''00:00''&&prev.length&&prev[prev.length-1].v===cur[0].v) cur=cur.slice(1); if(cur.length){ const L=Object.assign({},cur[cur.length-1]); if((L.end===''00:00''||L.end===''23:59''||L.end==='''')&&next.length&&next[0].start===''00:00''&&next[0].v===L.v){ L.end=`${next[0].end} (${names[(di+1)%7]})`; } cur[cur.length-1]=L; } if(!cur.length) return `<div style=''padding:36px 4px;color:var(--hs-sub,#66666B);font-size:16px;line-height:1.5;text-align:left''>No Home Assistant heating schedule for this day yet.<br>Tap <b>•••</b> to create one.</div>`; return cur.map(s=>{ const on=s.v!==''off''; const c=on?''#E8642E'':''#7B80EA''; const txt=on?`${Number(s.v).toFixed(1)}°`:''Off''; return `<div style=''display:flex;align-items:center;gap:26px;padding:12px
        0''><div style=''width:56px;height:56px;flex:none;border-radius:50%;border:3px solid ${c};box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:${on?15:17}px;color:var(--hs-text,#2F2F33)''>${txt}</div><div style=''font-size:19px;color:var(--hs-text,#2F2F33)''>${s.start} - ${s.end}</div></div>`; }).join(''''); ]]]'
    styles:
      card:
      - background: var(--hs-card,#FFFFFF)
      - padding: 16px 22px 130px
      custom_fields:
        list:
        - justify-self: stretch
      grid:
      - grid-template-areas: '"list"'
      - grid-template-columns: 1fr
    template: hive_clear
    triggers_update: all

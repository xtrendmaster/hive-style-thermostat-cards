# Hive-style thermostat cards - Home Assistant package
#
# Helpers, scripts and an automation used by the example dashboard.
# Install: copy this file to /config/packages/ and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
# then restart Home Assistant.
#
# Replace the example entity IDs with your own:
#   climate.hive_thermostat              -> your Hive heating thermostat
#   water_heater.hive_hot_water          -> your Hive hot water
#   binary_sensor.hive_thermostat_boost  -> Hive "Boost" binary sensor (heating)
#   binary_sensor.hive_hot_water_boost   -> Hive "Hotwater Boost" binary sensor
#   timer.boost_study_radiator           -> one timer per NON-Hive valve: timer.boost_<valve object id>
#     (optional for Hive devices too - timer.boost_hive_thermostat, timer.boost_water_hive_hot_water, ... -
#      used when the Hive integration has no boost actions; the setup page creates them for you)
#   input_boolean.hive_room_schedule_study_radiator -> one per radiator: hive_room_schedule_<valve object id>
#     (on = that room is on Schedule and follows the main heating schedule's temperature)

input_boolean:
  hive_ha_schedule:
    name: Home Assistant runs the heating schedule
    icon: mdi:calendar-clock
  heating_away_mode:
    name: Away / holiday mode
    icon: mdi:airplane
  # Presence: lower the heating when nobody's home, put it back when someone comes home
  hive_eco_when_nobody_home:
    name: Lower to 16° when nobody's home (30 min)
    icon: mdi:home-export-outline
  hive_warm_up_approaching:
    name: Warm up when approaching home
    icon: mdi:home-import-outline
  hive_away_eco_active:
    name: Heating lowered - nobody home
    icon: mdi:leaf
  hive_ha_water_schedule:
    name: Home Assistant runs the hot water schedule
    icon: mdi:water-boiler-auto
  # One per radiator: the room is on Schedule and follows the main heating schedule.
  hive_room_schedule_study_radiator:
    name: Study radiator follows the heating schedule
    icon: mdi:calendar-sync

input_select:
  hive_appearance:
    name: Heating dashboard appearance
    icon: mdi:theme-light-dark
    options: [Light, Dark, Auto, Noir]

timer:
  # Boost timer for a non-Hive radiator valve (Sonoff, Aqara, Tuya...).
  # The name must be boost_<object id of the climate entity>.
  boost_study_radiator:
    name: Boost study radiator
    icon: mdi:bullseye
    duration: "01:00:00"
    restore: true

script:
  hive_boost:
    alias: Hive - toggle boost
    description: >-
      Starts a boost, or cancels it if one is running. Hive thermostat and hot water use
      Hive's own boost. Hive radiator valves use Hive's boost but are cancelled by restoring a
      snapshot (the Hive integration's boost_heating_off fails on TRVs). Other valves are boosted
      by Home Assistant with timer.boost_<object id>. When the Hive integration has no boost actions
      (the dashboard sends ha_boost: true), Hive devices are boosted by Home Assistant the same way.
    icon: mdi:bullseye
    mode: parallel
    fields:
      entity_id:
        name: Entity
        required: true
        selector:
          entity:
            domain: [climate, water_heater]
      minutes:
        name: Minutes
        default: 60
        selector:
          number: {min: 30, max: 360, step: 30}
      temperature:
        name: Temperature
        default: 21
        selector:
          number: {min: 7, max: 30, step: 0.5}
      ha_boost:
        name: Home Assistant boost
        description: Boost with a Home Assistant timer even on Hive devices (for when Hive's boost actions are missing).
        default: false
        selector:
          boolean: {}
    sequence:
      - variables:
          temp: "{{ temperature | default(21) | float }}"
          period: "{{ '%02d:%02d:00' % ((minutes | default(60) | int) // 60, (minutes | default(60) | int) % 60) }}"
          is_water: "{{ entity_id.startswith('water_heater.') }}"
          is_main: "{{ entity_id == 'climate.hive_thermostat' }}"
          is_hive: "{{ (entity_id.startswith('water_heater.') or entity_id in integration_entities('hive')) and not (ha_boost | default(false) | bool) }}"
          key: "{{ ('water_' if entity_id.startswith('water_heater.') else '') ~ entity_id.split('.')[1] }}"
          boost_timer: "timer.boost_{{ key }}"
          restore_scene: "scene.hive_boost_{{ key }}"
          restore_scene_id: "hive_boost_{{ key }}"
          boosting: >-
            {% if is_state(boost_timer, 'active') %}true
            {% elif entity_id == 'climate.hive_thermostat' %}{{ is_state('binary_sensor.hive_thermostat_boost', 'on') }}
            {% elif entity_id == 'water_heater.hive_hot_water' %}{{ is_state('binary_sensor.hive_hot_water_boost', 'on') }}
            {% elif entity_id in integration_entities('hive') %}{{ is_state_attr(entity_id, 'preset_mode', 'boost') }}
            {% else %}{{ is_state('timer.boost_' ~ entity_id.split('.')[1], 'active') }}{% endif %}
      - choose:
          - alias: Hot water
            conditions: "{{ is_water and is_hive }}"
            sequence:
              - action: hive.boost_hot_water
                data:
                  entity_id: "{{ entity_id }}"
                  time_period: "{{ period }}"
                  on_off: "{{ 'off' if boosting else 'on' }}"
          - alias: Main thermostat boosting - cancel
            conditions: "{{ boosting and is_main and is_hive }}"
            sequence:
              - action: hive.boost_heating_off
                data:
                  entity_id: "{{ entity_id }}"
          - alias: Non-Hive valve boosting - cancel
            conditions: "{{ boosting and not is_hive }}"
            sequence:
              - action: timer.cancel
                target:
                  entity_id: "{{ boost_timer }}"
              - if: "{{ restore_scene in (states.scene | map(attribute='entity_id') | list) }}"
                then:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ restore_scene }}"
                else:
                  - if: "{{ is_water }}"
                    then:
                      - action: water_heater.set_operation_mode
                        target:
                          entity_id: "{{ entity_id }}"
                        data:
                          operation_mode: "off"
                      - stop: Hot water boost cancelled
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: "{{ entity_id }}"
                    data:
                      hvac_mode: "off"
          - alias: Hive radiator valve boosting - cancel by restoring the snapshot
            conditions: "{{ boosting }}"
            sequence:
              - if: "{{ restore_scene in (states.scene | map(attribute='entity_id') | list) }}"
                then:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ restore_scene }}"
                else:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: "{{ entity_id }}"
                    data:
                      hvac_mode: "off"
          - alias: Non-Hive valve - start a Home Assistant boost
            conditions: "{{ not is_hive }}"
            sequence:
              - action: scene.create
                data:
                  scene_id: "{{ restore_scene_id }}"
                  snapshot_entities: ["{{ entity_id }}"]
              - if: "{{ is_water }}"
                then:
                  - action: water_heater.set_operation_mode
                    target:
                      entity_id: "{{ entity_id }}"
                    data:
                      operation_mode: "on"
                else:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: "{{ entity_id }}"
                    data:
                      hvac_mode: heat
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ entity_id }}"
                    data:
                      temperature: "{{ temp }}"
              - action: timer.start
                target:
                  entity_id: "{{ boost_timer }}"
                data:
                  duration: "{{ period }}"
        default:
          - if: "{{ not is_main }}"
            then:
              - action: scene.create
                data:
                  scene_id: "{{ restore_scene_id }}"
                  snapshot_entities: ["{{ entity_id }}"]
          - action: hive.boost_heating_on
            target:
              entity_id: "{{ entity_id }}"
            data:
              time_period: "{{ period }}"
              temperature: "{{ temp }}"
      - alias: Boost cancelled on a room that's on Schedule - catch up with the schedule
        if: "{{ boosting and entity_id.startswith('climate.') and is_state('input_boolean.hive_room_schedule_' ~ entity_id.split('.')[1], 'on') }}"
        then:
          - delay:
              seconds: 5
          - action: script.hive_rooms_follow_schedule
            data:
              only: "{{ entity_id }}"

  hive_adjust_target:
    alias: Hive - nudge target temperature
    description: >-
      Moves the target by delta, clamped to the device's range. Kept for automations and voice;
      the dashboard arrows use the card's write gate instead (one change after you stop tapping),
      because Hive blocks bursts of changes. Don't call this many times in a row.
    icon: mdi:thermometer-plus
    mode: queued
    max: 10
    fields:
      entity_id:
        name: Entity
        required: true
        selector:
          entity:
            domain: climate
      delta:
        name: Delta
        default: 0.5
        selector:
          number: {min: -5, max: 5, step: 0.5}
    sequence:
      - action: climate.set_temperature
        target:
          entity_id: "{{ entity_id }}"
        data:
          temperature: >-
            {{ [[ (state_attr(entity_id, 'temperature') | float(18)) + (delta | float(0.5)),
                  state_attr(entity_id, 'min_temp') | float(5) ] | max,
                state_attr(entity_id, 'max_temp') | float(32) ] | min }}
      - delay:
          milliseconds: 700

  hive_set_mode:
    alias: Hive - set mode (Manual / Schedule / Off)
    description: >-
      For the main thermostat, Schedule hands control to the Home Assistant schedule once a
      schedule tagged hive_heating exists; otherwise it falls back to Hive's own schedule.
      For a radiator, Schedule makes the room follow the main heating schedule's temperature
      (input_boolean.hive_room_schedule_<valve>); without a Home Assistant schedule it uses the
      valve's own schedule.
    icon: mdi:thermostat-cog
    mode: queued
    fields:
      entity_id:
        name: Entity
        required: true
        selector:
          entity:
            domain: [climate, water_heater]
      mode:
        name: Mode
        required: true
        selector:
          select:
            options: [manual, schedule, "off"]
    sequence:
      - variables:
          is_main: "{{ entity_id == 'climate.hive_thermostat' }}"
          room_flag: "input_boolean.hive_room_schedule_{{ entity_id.split('.')[1] }}"
          ha_schedule_ready: >-
            {{ states.switch | selectattr('attributes.tags', 'defined')
               | selectattr('attributes.tags', 'contains', 'hive_heating') | list | count > 0 }}
          ha_water_ready: >-
            {{ states.switch | selectattr('attributes.tags', 'defined')
               | selectattr('attributes.tags', 'contains', 'hive_hot_water') | list | count > 0 }}
      - choose:
          - alias: Hot water on the Home Assistant schedule
            conditions: "{{ entity_id.startswith('water_heater.') and mode == 'schedule' and ha_water_ready }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hive_ha_water_schedule
              - action: script.hive_apply_water_schedule_now
          - alias: Hot water
            conditions: "{{ entity_id.startswith('water_heater.') }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hive_ha_water_schedule
              - action: water_heater.set_operation_mode
                target:
                  entity_id: "{{ entity_id }}"
                data:
                  operation_mode: "{{ {'manual': 'on', 'schedule': 'eco', 'off': 'off'}[mode] }}"
          - alias: Main thermostat on the Home Assistant schedule
            conditions: "{{ is_main and mode == 'schedule' and ha_schedule_ready }}"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ entity_id }}"
                data:
                  hvac_mode: heat
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hive_ha_schedule
              - action: script.hive_apply_schedule_now
          - alias: Radiator follows the Home Assistant heating schedule
            conditions: "{{ not is_main and entity_id.startswith('climate.') and mode == 'schedule' and ha_schedule_ready and states(room_flag) in ['on', 'off'] }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ room_flag }}"
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ entity_id }}"
                data:
                  hvac_mode: heat
              - action: script.hive_rooms_follow_schedule
                data:
                  only: "{{ entity_id }}"
        default:
          - if: "{{ is_main }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hive_ha_schedule
          - if: "{{ not is_main and is_state(room_flag, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ room_flag }}"
          - alias: Valve without an Off mode (e.g. Hive valve on Zigbee2MQTT) - Off sets frost protection
            if: "{{ mode == 'off' and 'off' not in (state_attr(entity_id, 'hvac_modes') or ['off']) }}"
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ entity_id }}"
                data:
                  temperature: "{{ state_attr(entity_id, 'min_temp') | float(5) }}"
            else:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ entity_id }}"
                data:
                  hvac_mode: "{% set m = {'manual': 'heat', 'schedule': 'auto', 'off': 'off'}[mode] %}{{ m if m in (state_attr(entity_id, 'hvac_modes') or [m]) else 'heat' }}"

  hive_apply_schedule_now:
    alias: Hive - apply current schedule slot now
    description: Re-applies today's Home Assistant schedule slot (schedules tagged hive_heating).
    icon: mdi:calendar-sync
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.hive_ha_schedule
        state: "on"
      - variables:
          day: "{{ now().strftime('%a') | lower }}"
          sched: >-
            {% set ns = namespace(single='', any='') %}
            {% for s in states.switch | selectattr('attributes.tags', 'defined')
                 | selectattr('attributes.tags', 'contains', 'hive_heating') | rejectattr('state', 'in', ['off', 'unavailable', 'unknown']) %}
              {% set w = s.attributes.weekdays | default([]) %}
              {% if day in w or 'daily' in w %}
                {% if w | count == 1 %}{% set ns.single = s.entity_id %}{% else %}{% set ns.any = s.entity_id %}{% endif %}
              {% endif %}
            {% endfor %}{{ ns.single or ns.any }}
      - condition: template
        value_template: "{{ sched != '' }}"
      - action: scheduler.run_action
        data:
          entity_id: "{{ sched }}"
          time: "{{ now().strftime('%H:%M:%S') }}"

  hive_rooms_follow_schedule:
    alias: Hive - rooms on Schedule follow the heating schedule
    description: >-
      Sets every radiator that's on Schedule (input_boolean.hive_room_schedule_<valve> on) to its
      current schedule slot: the room's own schedule (schedules tagged hive_room_<valve>) if it has
      times for today, otherwise the house heating schedule (tagged hive_heating). Leaves alone rooms
      that are off or boosting. A room you nudge keeps your change until the next schedule slot, like Hive.
    icon: mdi:home-thermometer
    mode: restart
    fields:
      only:
        name: Only this radiator
        description: Leave empty for every room on Schedule.
        selector:
          entity:
            domain: climate
      include_own:
        name: Include rooms with their own schedule
        description: Rooms with their own times normally change on their own slots; turn on to set them now too.
        default: false
        selector:
          boolean:
    sequence:
      - condition: state
        entity_id: input_boolean.hive_ha_schedule
        state: "on"
      - variables:
          rooms: >-
            {%- macro slot(tag) -%}
            {%- set day = now().strftime('%a') | lower -%}
            {%- set t = now().strftime('%H:%M') -%}
            {%- set ns = namespace(single=none, any=none, temp='') -%}
            {%- for s in states.switch | selectattr('attributes.tags', 'defined') | selectattr('attributes.tags', 'contains', tag) | rejectattr('state', 'in', ['off', 'unavailable', 'unknown']) -%}
              {%- set w = s.attributes.weekdays | default([]) -%}
              {%- if day in w or 'daily' in w or ('workday' in w and day in ['mon','tue','wed','thu','fri']) or ('weekend' in w and day in ['sat','sun']) -%}
                {%- if w | count == 1 and w[0] == day -%}{%- set ns.single = s -%}{%- else -%}{%- set ns.any = s -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set sw = ns.single or ns.any -%}
            {%- if sw -%}{%- for sl in sw.attributes.timeslots | default([]) -%}
              {%- set a = sl.split(' - ') -%}{%- set stop = '24:00' if a[1] == '00:00' else a[1] -%}
              {%- if a[0] <= t < stop -%}
                {%- set acts = sw.attributes.actions | default([]) -%}
                {%- set act = acts[loop.index0] if acts | count > 1 else acts[0] -%}
                {%- set ns.temp = (act.data or act.service_data or {}).temperature -%}
              {%- endif -%}
            {%- endfor -%}{%- endif -%}
            {{- ns.temp -}}
            {%- endmacro -%}
            {%- set house = slot('hive_heating') -%}
            {%- set ns2 = namespace(r=[]) -%}
            {%- for b in states.input_boolean | selectattr('state', 'eq', 'on') -%}
              {%- if b.object_id.startswith('hive_room_schedule_') -%}
                {%- set o = b.object_id[19:] -%}{%- set e = 'climate.' ~ o -%}{%- set st = states[e] -%}
                {%- if st and st.state not in ['off', 'unavailable', 'unknown'] and (not (only | default('')) or e == only)
                      and st.attributes.preset_mode | default('') != 'boost' and not is_state('timer.boost_' ~ o, 'active') -%}
                  {%- set own = slot('hive_room_' ~ o) -%}
                  {%- set tt = own if own != '' else house -%}
                  {%- if tt != '' and (own == '' or (only | default('')) or (include_own | default(false))) -%}{%- set ns2.r = ns2.r + [[e, tt | float, own != '']] -%}{%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns2.r }}
      - repeat:
          for_each: "{{ rooms }}"
          sequence:
            - variables:
                t: >-
                  {{ [[repeat.item[1] | float, state_attr(repeat.item[0], 'min_temp') | float(5)] | max,
                      state_attr(repeat.item[0], 'max_temp') | float(32)] | min }}
            - if: "{{ (state_attr(repeat.item[0], 'temperature') | float(-1)) != t }}"
              then:
                - action: climate.set_temperature
                  target:
                    entity_id: "{{ repeat.item[0] }}"
                  data:
                    temperature: "{{ t }}"
                  continue_on_error: true
                - delay:
                    seconds: "{{ 4 if repeat.item[0] in integration_entities('hive') else 0 }}"

  hive_apply_water_schedule_now:
    alias: Hive - apply current hot water slot now
    description: Re-applies today's Home Assistant hot water schedule slot (schedules tagged hive_hot_water).
    icon: mdi:water-boiler-auto
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.hive_ha_water_schedule
        state: "on"
      - variables:
          day: "{{ now().strftime('%a') | lower }}"
          sched: >-
            {% set ns = namespace(single='', any='') %}
            {% for s in states.switch | selectattr('attributes.tags', 'defined')
                 | selectattr('attributes.tags', 'contains', 'hive_hot_water') | rejectattr('state', 'in', ['off', 'unavailable', 'unknown']) %}
              {% set w = s.attributes.weekdays | default([]) %}
              {% if day in w or 'daily' in w %}
                {% if w | count == 1 %}{% set ns.single = s.entity_id %}{% else %}{% set ns.any = s.entity_id %}{% endif %}
              {% endif %}
            {% endfor %}{{ ns.single or ns.any }}
      - condition: template
        value_template: "{{ sched != '' }}"
      - action: scheduler.run_action
        data:
          entity_id: "{{ sched }}"
          time: "{{ now().strftime('%H:%M:%S') }}"

  hive_advance_to_next:
    alias: Hive - advance to next schedule slot
    description: Hive-style "Advance to next" - applies the next Home Assistant schedule slot now.
    icon: mdi:skip-next
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.hive_ha_schedule
        state: "on"
      - variables:
          sched: >-
            {% set ns = namespace(best='', t=none) %}
            {% for s in states.switch | selectattr('attributes.tags', 'defined')
                 | selectattr('attributes.tags', 'contains', 'hive_heating') | rejectattr('state', 'in', ['off', 'unavailable', 'unknown']) %}
              {% set nt = as_datetime(s.attributes.next_trigger) if s.attributes.next_trigger is defined and s.attributes.next_trigger else none %}
              {% if nt is not none and (ns.t is none or nt < ns.t) %}{% set ns.t = nt %}{% set ns.best = s.entity_id %}{% endif %}
            {% endfor %}{{ ns.best }}
      - condition: template
        value_template: "{{ sched != '' }}"
      - action: scheduler.run_action
        data:
          entity_id: "{{ sched }}"
          time: "{{ (as_datetime(state_attr(sched, 'next_trigger')) + timedelta(minutes=1)).strftime('%H:%M:%S') }}"

automation:
  - id: hive_style_rooms_follow_schedule
    alias: Hive-style - rooms on Schedule follow the heating schedule
    description: When the main heating schedule changes temperature, rooms on Schedule follow it.
    mode: restart
    triggers:
      - trigger: state
        entity_id: climate.hive_thermostat
        attribute: temperature
        for: {seconds: 15}
      - trigger: state
        entity_id: input_boolean.hive_ha_schedule
        to: "on"
        for: {seconds: 15}
    actions:
      - action: script.hive_rooms_follow_schedule
  - id: hive_style_end_valve_boost
    alias: Hive-style - end Home Assistant boost on non-Hive valves
    description: When a timer.boost_* finishes, put that valve back to its pre-boost mode and temperature.
    mode: parallel
    triggers:
      - trigger: event
        event_type: timer.finished
    conditions:
      - "{{ trigger.event.data.entity_id.startswith('timer.boost_') }}"
    actions:
      - action: scene.turn_on
        target:
          entity_id: "scene.hive_boost_{{ trigger.event.data.entity_id.split('.')[1][6:] }}"
        continue_on_error: true
      - if: "{{ is_state('input_boolean.hive_room_schedule_' ~ trigger.event.data.entity_id.split('.')[1][6:], 'on') }}"
        then:
          - delay:
              seconds: 5
          - action: script.hive_rooms_follow_schedule
            data:
              only: "climate.{{ trigger.event.data.entity_id.split('.')[1][6:] }}"
  - id: hive_style_presence_eco
    alias: Hive-style - lower the heating when nobody's home
    description: >-
      When nobody has been home for 30 minutes, holds the main thermostat at 16° at most
      (it only lowers, Off stays off; rooms on Schedule follow it). When someone comes home,
      or enters the "Approaching home" zone with warm-up on, the current schedule slot is put back.
      Needs Home Assistant to run the heating schedule. Turn it on or off on the Manage page.
    mode: queued
    max: 10
    triggers:
      - trigger: numeric_state
        entity_id: zone.home
        below: 1
        for: {minutes: 30}
        id: away
      - trigger: state
        entity_id: climate.hive_thermostat
        attribute: temperature
        id: enforce
      - trigger: numeric_state
        entity_id: zone.home
        above: 0
        id: home
      - trigger: numeric_state
        entity_id: zone.approaching_home
        above: 0
        id: approaching
    actions:
      - choose:
          - alias: Nobody home for 30 min - lower to 16
            conditions:
              - condition: trigger
                id: away
              - condition: state
                entity_id: input_boolean.hive_eco_when_nobody_home
                state: "on"
              - condition: state
                entity_id: input_boolean.hive_ha_schedule
                state: "on"
              - condition: state
                entity_id: climate.hive_thermostat
                state: heat
              - condition: numeric_state
                entity_id: zone.home
                below: 1
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hive_away_eco_active
              - if:
                  - condition: numeric_state
                    entity_id: climate.hive_thermostat
                    attribute: temperature
                    above: 16
                then:
                  - action: climate.set_temperature
                    target:
                      entity_id: climate.hive_thermostat
                    data:
                      temperature: 16
          - alias: The schedule raised the target while nobody's home - hold at 16
            conditions:
              - condition: trigger
                id: enforce
              - condition: state
                entity_id: input_boolean.hive_away_eco_active
                state: "on"
              - condition: numeric_state
                entity_id: climate.hive_thermostat
                attribute: temperature
                above: 16
              - "{% set e = 'climate.hive_thermostat' %}{{ not is_state_attr(e, 'preset_mode', 'boost') and not is_state('timer.boost_' ~ e.split('.')[1], 'active') }}"
            sequence:
              - action: climate.set_temperature
                target:
                  entity_id: climate.hive_thermostat
                data:
                  temperature: 16
          - alias: Someone home, or approaching with warm-up on - put the schedule back
            conditions:
              - condition: state
                entity_id: input_boolean.hive_away_eco_active
                state: "on"
              - condition: or
                conditions:
                  - condition: trigger
                    id: home
                  - condition: and
                    conditions:
                      - condition: trigger
                        id: approaching
                      - condition: state
                        entity_id: input_boolean.hive_warm_up_approaching
                        state: "on"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hive_away_eco_active
              - action: script.hive_apply_schedule_now
